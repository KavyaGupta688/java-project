# ------------------------------------------------------------
# Database connection settings.
# Edit these to match your local MySQL installation before
# building/deploying the app. No external API keys are needed
# anywhere in this project.
# ------------------------------------------------------------
# Embedded H2 Database (zero setup, standalone local mode)
db.driver=org.h2.Driver
db.url=jdbc:h2:./db/clinic_h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
db.username=sa
db.password=
db.pool.size=10

